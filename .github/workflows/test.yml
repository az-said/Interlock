name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invariants, fault sweep, integration
        run: python -m unittest discover -s tests -v
      - name: Results tables match the code
        run: |
          python experiments/run_all.py > /dev/null
          python viewer/build.py
          git diff --exit-code -I "^Generated" -- results/
