\* Liveness: Termination and EffectResolved under weak fairness, no pauses, a finite crash
\* budget, and URGENT time (the clock advances only when nothing else can progress), so the
\* bounded clock cannot starve a run. No SYMMETRY: TLC does not allow it with liveness.
SPECIFICATION LiveSpec
CONSTANTS
  w1 = w1
  w2 = w2
  Workers = {w1, w2}
  None = None
  Tier = 2
  Queryable = TRUE
  MODE = "interlock"
  BROKEN = "none"
  PAUSE = FALSE
  SERVER_SLOW = FALSE
  URGENT = TRUE
  Events = {"revoke", "hand_refund_full", "cancel"}
  MaxClock = 20
  LeaseTTL = 3
  SendTimeout = 2
  SettleMargin = 2
  DedupAge = 6
  MaxCrashes = 1
PROPERTIES
  Termination
  EffectResolved
CHECK_DEADLOCK FALSE
