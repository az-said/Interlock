\* Temporal alone with its recommended key (run id + activity id). runtime_tlc.py checks each invariant separately.
\* Constants actually run. The spec's base values are MaxClock 12, MaxCrashes 2, DedupAge 6 and all
\* six events; that space did not finish (MaxClock 10 alone is 43M states at tier 2), so runs use
\* MaxClock 10, one crash, DedupAge 5 (the smallest value that keeps a tier-1 retry reachable, since
\* recovery starts at least SendTimeout + SettleMargin + 1 = 5 after dispatch) and two event groups:
\* G1 below, and G2 = {prune_keys, redecide, revoke} set by experiments/runtime_tlc.py. A partial
\* hand refund behaves exactly like a full one in this model (both make the premise false and both pass
\* (b)'s eligibility check), so it is left out of the groups. See spec/README.md.
SPECIFICATION Spec
CONSTANTS
  w1 = w1
  w2 = w2
  Workers = {w1, w2}
  None = None
  Tier = 2
  Queryable = TRUE
  MODE = "temporal_idem"
  BROKEN = "none"
  PAUSE = FALSE
  SERVER_SLOW = FALSE
  URGENT = FALSE
  Events = {"revoke", "hand_refund_full", "cancel"}
  MaxClock = 10
  LeaseTTL = 3
  SendTimeout = 2
  SettleMargin = 2
  DedupAge = 5
  MaxCrashes = 1
SYMMETRY Sym
INVARIANTS
  NoRerunAfterComplete
  AtMostOneCommit
  EffectAtMostOnceTier12
  Tier3NeverResends
  NoOverlappingSends
  SendRequiresLiveClaim
  NoSendUnderRevokedGrant
  RevokeLinearizable
  NoSendOnStalePremise
  RecoveryRechecks
  PayloadBound
  NoSendAfterCancel
  CommittedImpliesApplied
CHECK_DEADLOCK FALSE
