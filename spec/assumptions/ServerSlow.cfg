\* A2 violated (SERVER_SLOW). Expected: EffectAtMostOnceTier12 violated at tier 2 in all three modes; interlock records LATE_RESULT.
\* Constants actually run. The spec's base values are MaxClock 12, MaxCrashes 2, DedupAge 6 and all
\* six events; that space did not finish (MaxClock 10 alone is 43M states at tier 2), so runs use
\* MaxClock 10 (9 for these assumption toggles), one crash, DedupAge 5 (the smallest value that keeps a tier-1 retry reachable, since
