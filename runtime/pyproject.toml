[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "interlock-runtime"
version = "0.1.0"
description = "Durable workflow runtime for agents on Postgres: recorded steps, timers, signals, leased workers, gated effects with receipts."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["hypothesis>=6"]

[tool.setuptools]
packages = ["interlock_runtime"]

[tool.setuptools.package-data]
interlock_runtime = ["schema.sql"]
